# Cloudflare Pages configuration
# 
# IMPORTANT: For Pages deployment via CLI, use:
#   wrangler pages deploy dist --project-name=pi-game
#
# DO NOT use: wrangler deploy (that's for Workers, not Pages)
#
# This file is used by Cloudflare Pages to know where your build output is.
# The pages_build_output_dir tells Cloudflare where to find the built files.
#
name = "pi-game"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"
